name: Android CI

on:
  push:
    branches:
      - feature/wear-modernization-2026
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          # API 37 is published by the SDK manager under android-37.0.
          # AGP currently resolves compileSdk 37 using the android-37 directory name.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests, lint and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit generated Room schema
        if: success() && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/schemas
          if ! git diff --cached --quiet; then
            git commit -m "chore(db): export Room schema [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jmoneywear-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
